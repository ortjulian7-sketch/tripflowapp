<!doctype html>
<html lang="es-419">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0500fe" />
    <meta name="description" content="Tripflow — controlá el presupuesto de tu viaje" />
    <title>Tripflow</title>
    <script>
      // Resuelve el tema antes del primer paint (evita flash del tema incorrecto).
      // Debe reflejar exactamente la lógica de THEME_STORAGE_KEY en src/features/theme/ThemeProvider.tsx.
      ;(function () {
        var stored = localStorage.getItem('tripflow_theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
